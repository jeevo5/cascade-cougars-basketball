# Cascade Boys Basketball master calendar sync
name: Sync Google Calendar

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/sync-calendar.yml"
      - "scripts/sync_calendar.py"

permissions:
  contents: write

concurrency:
  group: sync-google-calendar
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out site
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install calendar parser
        run: pip install icalendar recurring-ical-events

      - name: Sync public Google Calendar
        run: python scripts/sync_calendar.py

      - name: Publish calendar changes
        run: |
          if git diff --quiet -- calendar-data.js calendar.ics; then
            echo "Calendar already up to date."
            exit 0
          fi
          git config user.name "Cascade Calendar Sync"
          git config user.email "actions@users.noreply.github.com"
          git add calendar-data.js calendar.ics
          git commit -m "Auto-sync Google Calendar"
          git push
